<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Portfolio Preview | Lewis NDAMBIRI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2305070f'/%3E%3Cpath d='M22 14v32h22' stroke='%233dd6b5' stroke-width='7' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=JetBrains+Mono:wght@500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
  </head>
  <body class="home-page">
    <main class="page-shell" id="preview-root"></main>
    <script type="module">
      const root = document.querySelector("#preview-root");
      const response = await fetch("index.md");
      const markdown = await response.text();
      root.innerHTML = markdown.replace(/^---[\s\S]*?---\s*/, "");

      const script = document.createElement("script");
      script.src = "assets/js/command-center.js";
      document.body.appendChild(script);

      if (window.location.hash) {
        requestAnimationFrame(() => {
          document.querySelector(window.location.hash)?.scrollIntoView();
        });
      }
    </script>
  </body>
</html>
