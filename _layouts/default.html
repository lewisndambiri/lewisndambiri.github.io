<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description }}">
    <meta name="theme-color" content="#05070f">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2305070f'/%3E%3Cpath d='M22 14v32h22' stroke='%233dd6b5' stroke-width='7' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <title>{{ page.title | default: site.title }}</title>
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{ page.title | default: site.title }}">
    <meta property="og:description" content="{{ page.description | default: site.description }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:image" content="{{ '/assets/img/cnc-rag-assistant-hero.jpg' | absolute_url }}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ page.title | default: site.title }}">
    <meta name="twitter:description" content="{{ page.description | default: site.description }}">
    <meta name="twitter:image" content="{{ '/assets/img/cnc-rag-assistant-hero.jpg' | absolute_url }}">
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Lewis NDAMBIRI",
        "url": "https://lewisndambiri.github.io",
        "jobTitle": "Industrial Engineer | AI and Data Science",
        "sameAs": [
          "https://linkedin.com/in/lewisndambiri/",
          "https://github.com/lewisndambiri"
        ]
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=JetBrains+Mono:wght@500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body class="{% if page.url == '/' %}home-page{% else %}content-page{% endif %}">
    <main class="page-shell">
      {% unless page.url == '/' %}
        <nav class="article-nav" aria-label="Page navigation">
          <a href="{{ '/' | relative_url }}">Lewis NDAMBIRI</a>
          <span>Case Study</span>
        </nav>
      {% endunless %}
      {{ content }}
    </main>
    <script src="{{ '/assets/js/command-center.js' | relative_url }}"></script>
    {% unless page.url == '/' %}
      <script type="module">
        import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs";

        mermaid.initialize({
          startOnLoad: false,
          theme: "dark",
          securityLevel: "loose",
          themeVariables: {
            background: "transparent",
            mainBkg: "#111827",
            primaryColor: "#111827",
            primaryTextColor: "#f7f8fb",
            primaryBorderColor: "#40d6c2",
            lineColor: "#6ea8ff",
            secondaryColor: "#1f2937",
            tertiaryColor: "#0c1017",
            fontFamily: "Inter, system-ui, sans-serif"
          }
        });

        document.querySelectorAll("pre > code.language-mermaid").forEach((code) => {
          const wrapper = document.createElement("div");
          wrapper.className = "mermaid";
          wrapper.textContent = code.textContent;
          code.parentElement.replaceWith(wrapper);
        });

        await mermaid.run({
          querySelector: ".mermaid"
        });
      </script>
    {% endunless %}
  </body>
</html>
