<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ site.description }}">
    <title>{{ page.title | default: site.title }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body class="{% if page.url == '/' %}home-page{% else %}content-page{% endif %}">
    <main class="page-shell">
      {% unless page.url == '/' %}
        <nav class="article-nav" aria-label="Page navigation">
          <a href="{{ '/' | relative_url }}">Lewis NDAMBIRI</a>
          <span>Case Study</span>
        </nav>
      {% endunless %}
      {{ content }}
    </main>
    <script src="{{ '/assets/js/command-center.js' | relative_url }}"></script>
    {% unless page.url == '/' %}
      <script type="module">
        import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs";

        mermaid.initialize({
          startOnLoad: false,
          theme: "dark",
          securityLevel: "loose",
          themeVariables: {
            background: "transparent",
            mainBkg: "#111827",
            primaryColor: "#111827",
            primaryTextColor: "#f7f8fb",
            primaryBorderColor: "#40d6c2",
            lineColor: "#6ea8ff",
            secondaryColor: "#1f2937",
            tertiaryColor: "#0c1017",
            fontFamily: "Inter, system-ui, sans-serif"
          }
        });

        document.querySelectorAll("pre > code.language-mermaid").forEach((code) => {
          const wrapper = document.createElement("div");
          wrapper.className = "mermaid";
          wrapper.textContent = code.textContent;
          code.parentElement.replaceWith(wrapper);
        });

        await mermaid.run({
          querySelector: ".mermaid"
        });
      </script>
    {% endunless %}
  </body>
</html>
